            'mientras que el modelo de desacoplamiento vertical de cañón urbano arroja ' + vert.c15.toFixed(1) + ' µg/m³ (' + vert.cPpb15 + ' ppb a P y T reales AEMET) a altura respiratoria peatonal adulta (z = 1,5 m) y ' +
            vert.c08.toFixed(1) + ' µg/m³ en cota pediátrica (z = 0,8 m, factor dosimétrico ICRP 66 = 2,15x), ' +
            (st.no2_40m < 20 && vert.c15 >= 20
              ? 'demostrando empíricamente el fenómeno de Ilusión de Cumplimiento frente al límite anual de 20 µg/m³ de la Directiva (UE) 2024/2881.'
              : 'verificando la trazabilidad vertical frente a la Directiva (UE) 2024/2881.');

            navigator.clipboard.writeText(text);
          }
          var banner = document.getElementById('zip-copy-banner');
          if (banner) {
            banner.textContent = '✅ Párrafo Doctoral copiado al portapapeles listo para pegar en Word / LaTeX: "' + st.name + ' (' + vert.c15.toFixed(1) + ' µg/m³ a 1,5 m)"';

            setTimeout(function () { banner.style.display = 'none'; }, 6000);

        window.__setZipTab = function (tab) {
          var tabs = ['local', 'physics', 'thesis', 'node'];

            var p = document.getElementById('panel-' + t);
            var b = document.getElementById('btn-tab-' + t);

            if (b) {
              b.style.background = t === tab ? '#0284c7' : '#1e293b';
              b.style.borderColor = t === tab ? '#38bdf8' : '#334155';
              b.style.color = t === tab ? '#ffffff' : '#cbd5e1';
            }
          });
        };

        function updateStationView() {
          var st = STATIONS[activeIdx] || STATIONS[0];
          var vert = computeVertical(st.no2_40m, st.hw);
          var illusion = st.no2_40m < 20 && vert.c15 >= 20;

          var detailEl = document.getElementById('station-detail-box');
          if (detailEl) {
            detailEl.innerHTML =
              '<div style="font-size:14px;font-weight:900;color:#fff;margin-bottom:4px;">' + st.code + ' — ' + st.name + '</div>' +
              '<div style="font-size:11px;color:#94a3b8;margin-bottom:10px;">Distrito: <strong style="color:#e2e8f0;">' + st.district + '</strong> • Red: <strong style="color:#38bdf8;">' + st.net + '</strong> • WGS84: ' + st.lat.toFixed(4) + '°N, ' + st.lon.toFixed(4) + '°W • H/W = ' + st.hw.toFixed(2) + ' • SVF = ' + st.svf.toFixed(2) + '</div>' +

                '</div>' +
                '<div style="background:#020617;border:1px solid #334155;padding:8px;border-radius:6px;text-align:center;">' +
                  '<div style="font-size:10px;color:#94a3b8;">PEATÓN (z = 1,5 m)</div>' +
                  '<div style="font-size:17px;font-weight:900;color:' + (vert.c15 >= 20 ? '#fbbf24' : '#34d399') + ';">' + vert.c15.toFixed(1) + ' µg/m³ (' + vert.cPpb15 + ' ppb)</div>' +

            var py = function (lat) { return Math.max(20, Math.min(H - 20, H - ((lat - minLat) / (maxLat - minLat)) * H)); };

            var clno2Contribution = Number((vert.c15 * 0.14).toFixed(2));

              '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;">' +
                '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;">' +
                  '<div style="font-size:13px;font-weight:800;color:#38bdf8;margin-bottom:8px;">⚗️ 1. Ciclo de Leighton Extendido, ClNO₂ Marino y Termólisis PAN (' + st.code + ')</div>' +
                  '<p style="font-size:11.5px;color:#cbd5e1;margin-bottom:10px;">Evaluación determinista sobre <strong>' + st.name + '</strong> con temperatura superficial ECOSTRESS (T_skin = 304,8 K) y brisa de Alborán:</p>' +
                  '<table style="width:100%;border-collapse:collapse;font-size:11.5px;">' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Fotólisis matinal de ClNO₂ heterogéneo (N₂O₅ + Cl⁻)</td><td style="padding:6px;border:1px solid #334155;color:#fbbf24;font-weight:800;">+' + clno2Contribution + ' µg/m³</td></tr>' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Termólisis de PAN por T_skin (k_PAN = 2,52×10¹⁶ exp(-13573/T_skin))</td><td style="padding:6px;border:1px solid #334155;color:#f87171;font-weight:800;">+' + panContribution + ' µg/m³</td></tr>' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Ozono Troposférico en equilibrio (O₃)</td><td style="padding:6px;border:1px solid #334155;color:#38bdf8;font-weight:800;">' + st.o3.toFixed(1) + ' µg/m³</td></tr>' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Aerosoles PM₂.₅ / PM₁₀</td><td style="padding:6px;border:1px solid #334155;color:#34d399;font-weight:800;">' + st.pm25.toFixed(1) + ' / ' + st.pm10.toFixed(1) + ' µg/m³</td></tr>' +
                  '</table>' +
                '</div>' +
                '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;">' +
                  '<div style="font-size:13px;font-weight:800;color:#34d399;margin-bottom:8px;">🛣️ 2. Física Interfacial del Viario (Asfalto 99,8 % vs. TiO₂ 0,2 %) y Fitorremediación</div>' +
                  '<table style="width:100%;border-collapse:collapse;font-size:11.5px;">' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Régimen Superficial en ' + st.name + '</td><td style="padding:6px;border:1px solid #334155;color:#fff;font-weight:800;">' + (st.tio2 ? 'Fotocatálisis TiO₂ Grado A1 Activa (Sumidero NO₃⁻)' : 'Asfalto Convencional SMA 11 / PA 11 (Conversión Stemmler HONO)') + '</td></tr>' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Balance Interfacial Superficial (ΔC_viario)</td><td style="padding:6px;border:1px solid #334155;color:' + (st.tio2 ? '#34d399' : '#fbbf24') + ';font-weight:800;">' + (surfaceRenox > 0 ? '+' : '') + surfaceRenox + ' µg/m³</td></tr>' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Alineación Arbórea Dominante</td><td style="padding:6px;border:1px solid #334155;color:#cbd5e1;">' + st.trees + '</td></tr>' +
                    '<tr><td style="padding:6px;border:1px solid #334155;">Cierre Metabólico Foliar (NR → NiR → GS-GOGAT) + Caulosfera</td><td style="padding:6px;border:1px solid #334155;color:#34d399;font-weight:800;">' + treeNetSink + ' µg/m³ (Sumidero Neto)</td></tr>' +
                  '</table>' +
                '</div>' +
              '</div>';
          }

          var thesisEl = document.getElementById('thesis-detail-content');
          if (thesisEl) {
            thesisEl.innerHTML =
              '<div style="background:#0f172a;border:1px solid #0284c7;border-radius:8px;padding:14px;margin-bottom:14px;">' +
                '<div style="font-size:13px;font-weight:900;color:#38bdf8;text-transform:uppercase;margin-bottom:10px;">🏆 Las 3 Aportaciones Científicas Mundiales de la Tesis Doctoral (UNED)</div>' +
                '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;">' +
                  '<div style="background:#020617;border:1px solid #1e293b;padding:12px;border-radius:6px;">' +
                    '<div style="color:#fbbf24;font-weight:800;font-size:12px;margin-bottom:4px;">1. Ilusión de Cumplimiento Vertical (Directiva UE 2024/2881)</div>' +
                    '<div style="font-size:11.5px;color:#cbd5e1;">Demostración empírica de que medir a 4,0 m subestima entre <strong>+22 % y +38 %</strong> la exposición real a 1,5 m (adulto) y 0,8 m (infantil ICRP 66 2,15x). En Málaga, 5 de los 11 distritos cumplen a 4,0 m (<20 µg/m³) pero incumplen a cota respiratoria.</div>' +
                  '</div>' +
                  '<div style="background:#020617;border:1px solid #1e293b;padding:12px;border-radius:6px;">' +
                    '<div style="color:#38bdf8;font-weight:800;font-size:12px;margin-bottom:4px;">2. Acoplamiento Fotoquímico Costero-Urbano (Alborán–Cañón)</div>' +
                    '<div style="font-size:11.5px;color:#cbd5e1;">Entre el <strong>29 % y el 37 %</strong> del NO₂ urbano procede de reciclaje secundario (fotólisis de ClNO₂ marino + termólisis de PAN gobernada por T_skin + renoxificación interfacial), explicando la no-linealidad de las ZBE.</div>' +
                  '</div>' +
                  '<div style="background:#020617;border:1px solid #1e293b;padding:12px;border-radius:6px;">' +

                    '<div style="font-size:11.5px;color:#cbd5e1;">Cuantificación árbol a árbol (885 ejemplares, 17 especies) del umbral crítico H/W donde la asimilación enzimática foliar (NR/NiR/GS-GOGAT) y cortical supera la retención aerodinámica del dosel.</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;">' +

                '<div style="overflow-x:auto;">' +
                  '<table style="width:100%;border-collapse:collapse;font-size:11.5px;">' +
                    '<thead><tr style="background:#1e293b;color:#38bdf8;text-align:left;">' +
                      '<th style="padding:6px;border:1px solid #334155;">#</th>' +

                      '<th style="padding:6px;border:1px solid #334155;">NO₂ 0,8 m</th>' +

                      '<th style="padding:6px;border:1px solid #334155;">Diagnóstico Doctoral</th>' +
                    '</tr></thead>' +
                    '<tbody>' +
                      DISTRICTS_11.map(function (d) {
                        return '<tr style="border-bottom:1px solid #1e293b;">' +
                          '<td style="padding:6px;color:#94a3b8;">' + d.id + '</td>' +
                          '<td style="padding:6px;font-weight:800;color:#fff;">' + d.name + '</td>' +
                          '<td style="padding:6px;color:' + (d.c40 >= 20 ? '#f87171' : '#34d399') + ';font-weight:800;">' + d.c40.toFixed(1) + ' µg/m³</td>' +
                          '<td style="padding:6px;color:' + (d.c15 >= 20 ? '#fbbf24' : '#34d399') + ';font-weight:800;">' + d.c15.toFixed(1) + ' µg/m³</td>' +

          if (nodeEl) {

              '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:14px;margin-bottom:14px;">' +
                '<div style="font-size:12.5px;font-weight:800;color:#38bdf8;text-transform:uppercase;margin-bottom:8px;">🛰️ Constelación de 16 Misiones Satelitales sobre Málaga (Regla 19)</div>' +
                '<table style="width:100%;border-collapse:collapse;font-size:11.5px;">' +
                  '<thead><tr style="background:#1e293b;color:#38bdf8;text-align:left;">' +
                    '<th style="padding:6px;border:1px solid #334155;">Misión Orbital</th>' +

                    '<th style="padding:6px;border:1px solid #334155;">Banda Espectral</th>' +

                      return '<tr style="border-bottom:1px solid #1e293b;">' +

                '<div style="background:#020617;border:1px solid #10b981;border-radius:6px;padding:10px;margin-bottom:8px;font-size:12px;">' +
                  '<strong style="color:#34d399;">En Windows (1 Clic):</strong> Haz doble clic en el archivo <code>ARRANCAR_EN_MI_PC.bat</code> que está en esta misma carpeta.' +
                '</div>' +

                  '<strong style="color:#fbbf24;">En Terminal (PowerShell / CMD):</strong> Ejecuta <code>npm install</code> y después <code>npm run dev</code>.' +
                '</div>' +
              '</div>';

        }

        renderStandaloneLauncher();
      })();
